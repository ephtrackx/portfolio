<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALEXANDER STRATONOV // PORTFOLIO</title>

    <!-- Google Fonts: Oswald, Inter & IBM Plex Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        studio: {
                            bg: '#1c1c1c',
                            alt: '#242422',
                            yellow: '#f5d200',
                            text: '#f5d200',
                            muted: 'rgba(245, 210, 0, 0.6)',
                            border: 'rgba(245, 210, 0, 0.25)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        heading: ['Oswald', 'sans-serif'],
                        mono: ['"IBM Plex Mono"', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- Стилі сторінки -->
    <link rel="stylesheet" href="styles.css">
</head>
<body class="min-h-[100dvh] flex flex-col selection:bg-studio-yellow selection:text-studio-bg">

    <!-- STICKY HEADER -->
    <div class="sticky top-0 z-[100] bg-studio-bg/95 backdrop-blur border-b border-studio-border">
        <header class="border-b border-studio-border/50 py-4">
            <div class="max-w-[1280px] mx-auto px-4 md:px-6">
                <a href="#" class="inline-block">
                    <span id="site-logo-text" class="font-heading font-bold text-3xl sm:text-5xl md:text-6xl tracking-tight uppercase whitespace-nowrap leading-none text-studio-yellow block">
                        ALEXANDER STRATONOV
                    </span>
                </a>
            </div>
        </header>

        <nav class="bg-studio-alt/80">
            <div class="max-w-[1280px] mx-auto px-4 md:px-6 flex justify-between items-center">
                <div id="navbar" class="flex items-center overflow-x-auto font-mono text-xs sm:text-sm no-scrollbar flex-grow">
                    <!-- Dynamic Tabs -->
                </div>
                <div class="flex items-center gap-1.5 shrink-0 pl-4 py-2">
                    <button id="btn-ua" onclick="setLanguage('ua')" class="lang-btn">UA</button>
                    <button id="btn-en" onclick="setLanguage('en')" class="lang-btn active">ENG</button>
                </div>
            </div>
        </nav>
    </div>

    <!-- TITLE / RECORD COUNT SECTION -->
    <section class="border-b border-studio-border bg-studio-alt/30 py-8 md:py-10">
        <div class="max-w-[1280px] mx-auto px-4 md:px-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
                <div>
                    <h1 id="page-title" class="font-heading text-3xl sm:text-5xl md:text-6xl font-bold uppercase tracking-tight leading-none text-studio-yellow">
                        ABOUT ME
                    </h1>
                </div>
                <div id="record-count-box" class="font-mono text-xs text-right bg-studio-bg p-2.5 border border-studio-border self-stretch md:self-auto flex items-center gap-3 justify-between md:justify-end">
                    <span class="text-studio-muted">TOTAL RECORDS:</span>
                    <span id="record-count" class="text-lg font-bold text-studio-yellow">0</span>
                </div>
            </div>
        </div>
    </section>

    <!-- MAIN CONTENT CONTAINER -->
    <main class="flex-grow max-w-[1280px] w-full mx-auto px-4 md:px-6 py-8 md:py-12">
        <div id="content-area" class="space-y-12">
            <!-- Dynamic Content -->
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="mt-auto border-t border-studio-border bg-studio-alt py-8 text-xs font-mono">
        <div class="max-w-[1280px] mx-auto px-4 md:px-6">
            <div class="text-studio-muted">
                © <span id="year">2026</span> <span id="footer-author-text">ALEXANDER STRATONOV</span>. <span id="footer-rights-text">ALL RIGHTS RESERVED.</span>
            </div>
        </div>
    </footer>

    <!-- Логіка портфоліо -->
    <script src="app.js"></script>
</body>
</html>
